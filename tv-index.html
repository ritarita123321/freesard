<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Fawaz GTA6</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: Tahoma, Arial, sans-serif; }
  #sub { position: absolute; left: 160px; right: 160px; bottom: 70px; text-align: center; display: none; }
  #sub span { display: inline-block; color: #fff; font-size: 46px; line-height: 1.5; padding: 16px 48px; min-width: 900px; border-radius: 28px; text-shadow: 0 2px 8px rgba(0,0,0,.65); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  body.s0 #sub span { background: linear-gradient(135deg, rgba(55,55,80,.80), rgba(12,12,22,.88)); border: 2px solid rgba(255,255,255,.28); box-shadow: 0 12px 44px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.30); }
  body.s1 #sub span { background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.10)); border: 2px solid rgba(255,255,255,.50); box-shadow: 0 12px 44px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.60); }
  body.s2 #sub span { background: rgba(0,0,0,.94); border-radius: 12px; }
  body.s3 #sub span { background: none; border: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; text-shadow: 0 0 6px #000, 3px 3px 3px #000, -3px -3px 3px #000, 3px -3px 3px #000, -3px 3px 3px #000; font-weight: bold; }
  body.s4 #sub span { background: rgba(0,0,0,.55); border-radius: 14px; }
  body.s5 #sub span { background: linear-gradient(135deg, rgba(255,79,163,.88), rgba(124,58,237,.88)); border: 2px solid rgba(255,255,255,.35); box-shadow: 0 12px 40px rgba(124,58,237,.45); }
  body.s6 #sub span { background: rgba(8,6,20,.85); border: 3px solid #ff4fa3; box-shadow: 0 0 18px #ff4fa3, 0 0 42px rgba(255,79,163,.55), inset 0 0 14px rgba(255,79,163,.35); text-shadow: 0 0 10px rgba(255,140,200,.9); }
  body.s7 #sub span { background: rgba(255,255,255,.95); color: #111; text-shadow: none; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  body.s8 #sub { left: 0; right: 0; }
  body.s8 #sub span { display: block; min-width: 0; border-radius: 0; background: rgba(0,0,0,.88); padding: 18px 120px; }
  body.s9 #sub span { background: linear-gradient(90deg, rgba(255,138,0,.9), rgba(255,79,163,.9) 55%, rgba(155,81,224,.9)); border: 2px solid rgba(255,255,255,.4); box-shadow: 0 12px 40px rgba(255,79,163,.4); }
  #panel { position: absolute; top: 40px; left: 40px; background: rgba(10,10,30,.88); color: #fff; padding: 28px 36px; border-radius: 18px; font-size: 30px; line-height: 1.6; max-width: 900px; }
  #code { font-size: 84px; letter-spacing: 14px; color: #ff6fb5; font-weight: bold; direction: ltr; text-align: center; }
  #state { font-size: 24px; opacity: .8; }
  small { font-size: 22px; opacity: .75; }
</style>
</head>
<body>
<div id="panel">
  <div>اكتب هالرمز بصفحة التلفون:</div>
  <div id="code">------</div>
  <div id="state">...</div>
  <div id="src"></div>
  <small>⏯ تغيير شكل الترجمة · شغّل الـ PS5 ع التلفزيون أول، وبعدين افتح التطبيق · ⬅️➡️ تغيير مدخل HDMI · ⬆️⬇️ حرّك الترجمة لحتى تغطّي الكتابة الإنكليزية · OK إخفاء/إظهار هالمربع · Back خروج</small>
</div>
<div id="sub"><span id="subtext"></span></div>

<script src="mqtt-mini.js"></script>
<script>
(function () {
  var hdmi = 1, bottom = 70, hideTimer = null;
  var panel = document.getElementById('panel');
  var sub = document.getElementById('sub');
  var subtext = document.getElementById('subtext');

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var code = store('fs_code');
  if (!code || !/^\d{6}$/.test(code)) {
    code = String(Math.floor(100000 + Math.random() * 900000));
    store('fs_code', code);
  }
  document.getElementById('code').textContent = code;
  hdmi = parseInt(store('fs_hdmi') || '1', 10) || 1;
  bottom = parseInt(store('fs_bottom') || '70', 10) || 70;
  sub.style.bottom = bottom + 'px';

  var mq = null;
  function tvdbg(o) { try { if (mq) mq.publish('freesard/tvdbg/' + code, JSON.stringify(o)); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { tvdbg({ hidden: document.hidden }); });

  function setState(s) {
    if (s === 'online') tvdbg({ up: '0.2.2', sty: sty, vmode: vmode, hidden: document.hidden, tizen: !!window.tizen, tvw: !!(window.tizen && tizen.tvwindow), src: document.getElementById('src').textContent });
    var map = { connecting: '⏳ عم يتصل...', online: '✅ متصل، ناطر التلفون', offline: '❌ ما في اتصال، عم يجرّب من جديد' };
    document.getElementById('state').textContent = map[s] || s;
  }

  var vmode = 0;
  var sty = parseInt(store('fs_style') || '0', 10) || 0;
  document.body.className = 's' + sty;
  var sz = store('fs_size'); if (sz) subtext.style.fontSize = sz + 'px';
  var bgw = store('fs_bgw'); bgw = bgw === null ? null : +bgw; if (bgw !== null) subtext.style.minWidth = bgw + 'px';
  var pd = store('fs_pad'); if (pd !== null) subtext.style.paddingTop = subtext.style.paddingBottom = pd + 'px';
  var xoff = +(store('fs_x') || 0); sub.style.transform = 'translateX(' + xoff + 'px)';
  function applyCfg(o) {
    if (o.style != null) { sty = +o.style; store('fs_style', sty); document.body.className = 's' + sty; }
    if (o.bottom != null) { bottom = +o.bottom; sub.style.bottom = bottom + 'px'; store('fs_bottom', bottom); }
    if (o.size) { subtext.style.fontSize = (+o.size) + 'px'; store('fs_size', o.size); }
    if (o.bgw != null) { bgw = +o.bgw; store('fs_bgw', bgw); subtext.style.minWidth = bgw + 'px'; }
    if (o.pad != null) { store('fs_pad', o.pad); subtext.style.paddingTop = subtext.style.paddingBottom = (+o.pad) + 'px'; }
    if (o.x != null) { xoff = +o.x; store('fs_x', xoff); sub.style.transform = 'translateX(' + xoff + 'px)'; }
  }
  var RECTS = [['0px', '0px', '1920px', '1080px'], ['480px', '270px', '960px', '540px']];
  function showVideo(srcEl) {
    if (vmode === 2) { try { tizen.tvwindow.hide(function () { tvdbg({ vmode: 2, hide: 'ok' }); }, function (e) { tvdbg({ hideErr: e.message }); }, 'MAIN'); } catch (x) { tvdbg({ hideEx: x.message }); } srcEl.textContent = 'وضع 3: بلا صورة'; return; }
    tizen.tvwindow.show(function () {
      var cur = null; try { cur = tizen.tvwindow.getSource(); } catch (x) {}
      srcEl.textContent = '📺 ' + (cur ? cur.type + ' ' + (cur.number || '') : 'TV');
      tvdbg({ show: 'ok', vmode: vmode, src: srcEl.textContent, hidden: document.hidden });
    }, function (e) { srcEl.textContent = '⚠️ ' + e.message; tvdbg({ showErr: e.message }); }, RECTS[vmode], 'MAIN', 'BEHIND');
    srcEl.textContent += ' · وضع ' + (vmode + 1);
  }

  function showHDMI(change) {
    var srcEl = document.getElementById('src');
    if (!window.tizen || !tizen.tvwindow) { srcEl.textContent = '⚠️ هالتلفزيون ما بيدعم عرض HDMI جوّا التطبيق'; return; }
    try {
      if (!change) { showVideo(srcEl); return; }
      tizen.systeminfo.getPropertyValue('VIDEOSOURCE', function (vs) {
        var list = (vs && vs.connected) || [], hd = [], i, src = null;
        for (i = 0; i < list.length; i++) if (list[i].type === 'HDMI') hd.push(list[i]);
        if (!hd.length) { srcEl.textContent = '⚠️ ما في شي مشبوك ع HDMI'; return; }
        for (i = 0; i < hd.length; i++) if (hd[i].number === hdmi) src = hd[i];
        if (!src) { src = hd[0]; hdmi = src.number; store('fs_hdmi', hdmi); }
        tizen.tvwindow.setSource(src, function () { showVideo(srcEl); }, function (e) { srcEl.textContent = '⚠️ HDMI ' + hdmi + ': ' + e.message; });
      }, function (e) { srcEl.textContent = '⚠️ ' + e.message; });
    } catch (e) { srcEl.textContent = '⚠️ ' + e.message; }
  }

  function showSub(text) {
    if (hideTimer) clearTimeout(hideTimer);
    if (!text) { sub.style.display = 'none'; return; }
    subtext.textContent = text;
    sub.style.display = 'block';
    panel.style.display = 'none';
    hideTimer = setTimeout(function () { sub.style.display = 'none'; }, 20000);
  }

  mq = new MiniMQTT({
    brokers: FS_BROKERS,
    topic: 'freesard/v1/' + code,
    onState: setState,
    onMessage: function (t, msg) {
      var d; try { d = JSON.parse(msg); } catch (e) { d = { t: msg }; }
      if (d.hello) { setState('📱 التلفون اتصل!'); return; }
      if (d.cfg) { applyCfg(d.cfg); if (d.t === undefined) return; }
      if (d.t && d.pos && d.pos.length >= 2) { var pm = d.pm || 'cover'; sub.style.top = ''; if (pm === 'above') { sub.style.bottom = Math.round((1 - d.pos[0]) * 1080) + 14 + 'px'; subtext.style.minHeight = ''; } else if (pm === 'below') { sub.style.bottom = 'auto'; sub.style.top = Math.round(d.pos[1] * 1080) + 14 + 'px'; subtext.style.minHeight = ''; } else { sub.style.bottom = Math.max(0, Math.round((1 - d.pos[1]) * 1080) - 16) + 'px'; subtext.style.minHeight = Math.max(0, Math.round((d.pos[1] - d.pos[0]) * 1080)) + 'px'; } if (d.pos.length === 4) { sub.style.left = Math.max(0, Math.round(d.pos[2] * 1920) - 50) + 'px'; sub.style.right = Math.max(0, Math.round((1 - d.pos[3]) * 1920) - 50) + 'px'; subtext.style.minWidth = '100%'; subtext.style.boxSizing = 'border-box'; sub.style.transform = ''; } }
      else if (d.t) { sub.style.top = ''; sub.style.bottom = bottom + 'px'; subtext.style.minHeight = ''; sub.style.left = ''; sub.style.right = ''; subtext.style.minWidth = bgw !== null ? bgw + 'px' : ''; sub.style.transform = 'translateX(' + xoff + 'px)'; }
      showSub(d.t || '');
      tvdbg({ got: (d.t || '').slice(0, 30), hidden: document.hidden });
    }
  });

  try {
    if (window.tizen && tizen.tvinputdevice) {
      ['ColorF0Red', 'ColorF1Green', 'MediaPlayPause', 'MediaPlay', 'MediaPause'].forEach(function (k) { try { tizen.tvinputdevice.registerKey(k); } catch (e) {} });
    }
  } catch (e) {}

  document.addEventListener('keydown', function (e) {
    tvdbg({ key: e.keyCode });
    switch (e.keyCode) {
      case 37: hdmi = hdmi > 1 ? hdmi - 1 : 4; store('fs_hdmi', hdmi); showHDMI(true); panel.style.display = 'block'; break;
      case 39: hdmi = hdmi < 4 ? hdmi + 1 : 1; store('fs_hdmi', hdmi); showHDMI(true); panel.style.display = 'block'; break;
      case 38: bottom = Math.min(900, bottom + 10); sub.style.bottom = bottom + 'px'; store('fs_bottom', bottom); showSub('مكان الترجمة هون'); break;
      case 40: bottom = Math.max(0, bottom - 10); sub.style.bottom = bottom + 'px'; store('fs_bottom', bottom); showSub('مكان الترجمة هون'); break;
      case 10252: case 415: case 19: sty = (sty + 1) % 10; store('fs_style', sty); document.body.className = 's' + sty; showSub('شكل ' + (sty + 1) + ': ' + ["Glass غامق","Glass فاتح","عادي (أسود)","بلا خلفية","أسود شفاف","زهر GTA","نيون","أبيض","شريط عريض","غروب Vice City"][sty]); break;
      case 13: panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; break;
      case 10009: try { tizen.application.getCurrentApplication().exit(); } catch (x) {} break;
    }
  });

  showHDMI();
})();
</script>
</body>
</html>

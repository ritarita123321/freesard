          import java.net.URLEncoder
          import kotlin.math.max
          import kotlin.math.min

          class CaptureService : Service() {

              companion object {
                  const val EXTRA_CODE = "code"
                  const val EXTRA_RESULT = "result"
                  const val EXTRA_DATA = "data"
                  const val EXTRA_PM = "pm"
                  const val EXTRA_HOLD = "hold"
                  const val EXTRA_TOP = "top"
                  @Volatile var status: String = ""
                  @Volatile var lastEn: String = ""
                  @Volatile var lastAr: String = ""
                  @Volatile var running = false
              }

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private val thread = HandlerThread("fawaz-capture").apply { start() }
              private val handler = Handler(thread.looper)
              private val main = Handler(Looper.getMainLooper())
              private val mqtt = MultiMqtt()
              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              private var translator: Translator? = null
              @Volatile private var translatorReady = false
              private val http = OkHttpClient()
              private val cache = HashMap<String, String>()

              private var code = ""
              private var posMode = "above"
              private var holdMs = 2000L
              private var topFrac = 0.55f
              private var w = 0
              private var h = 0
              @Volatile private var busy = false
              private var lastSentNorm = ""
              private var lastSeen = 0L
              private var shown = false
              @Volatile private var seq = 0
              @Volatile private var paused = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) return START_NOT_STICKY
                  startInForeground()
                  code = intent.getStringExtra(EXTRA_CODE) ?: ""
                  posMode = intent.getStringExtra(EXTRA_PM) ?: "above"
                  holdMs = intent.getLongExtra(EXTRA_HOLD, 2000L)
                  topFrac = intent.getFloatExtra(EXTRA_TOP, 0.55f)
                  val resultCode = intent.getIntExtra(EXTRA_RESULT, 0)
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION") intent.getParcelableExtra(EXTRA_DATA)
                  }
                  if (data == null) { stopSelf(); return START_NOT_STICKY }

                  mqtt.start("freesard/ctl/$code") { _, text ->
                      try {
                          val o = JSONObject(text)
                          main.post {
                              if (o.has("pm")) posMode = o.getString("pm")
                              if (o.has("hold")) holdMs = o.getLong("hold")
                              if (o.has("top")) topFrac = o.getDouble("top").toFloat()
                              if (o.has("on")) paused = !o.getBoolean("on")
                              status = if (paused) "⏸ الترجمة موقّفة من الموقع" else "✅ شغّال (الإعدادات من الموقع)"
                          }
                      } catch (_: Exception) {}
                  }
                  setupTranslator()

                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(resultCode, data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, handler)

                  computeSize()
                  reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = projection?.createVirtualDisplay(
                      "fawaz", w, h, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, handler
                  )
                  running = true
                  status = "✅ شغّال. افتح Momiji والعب"
                  handler.postDelayed(loop, 600)
                  handler.postDelayed(pinger, 30000)
                  main.postDelayed({ publish(JSONObject().put("hello", 1)) }, 2500)
                  return START_NOT_STICKY
              }

              private fun computeSize() {
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  var sw: Int
                  var sh: Int
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.maximumWindowMetrics.bounds
                      sw = b.width(); sh = b.height()
                  } else {
                      val dm = resources.displayMetrics
                      sw = dm.widthPixels; sh = dm.heightPixels
                  }
                  val big = max(sw, sh)
                  val small = min(sw, sh)
                  val scale = min(1f, 1600f / big)
                  w = (big * scale).toInt() / 2 * 2
                  h = (small * scale).toInt() / 2 * 2
              }

              private val pinger = object : Runnable {
                  override fun run() {
                      mqtt.ping()
                      handler.postDelayed(this, 30000)
                  }
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      if (!busy && !paused) grabAndRead()
                      handler.postDelayed(this, 250)
                  }
              }

              private fun grabAndRead() {
                  val image = try { reader?.acquireLatestImage() } catch (e: Exception) { null } ?: return
                  val bmp: Bitmap
                  try {
                      val plane = image.planes[0]
                      val pixelStride = plane.pixelStride
                      val rowPadding = plane.rowStride - pixelStride * image.width
                      val full = Bitmap.createBitmap(image.width + rowPadding / pixelStride, image.height, Bitmap.Config.ARGB_8888)
                      full.copyPixelsFromBuffer(plane.buffer)
                      val top = (image.height * topFrac).toInt()
                      bmp = Bitmap.createBitmap(full, 0, top, image.width, image.height - top)
                      if (bmp != full) full.recycle()
                  } catch (e: Exception) {
                      image.close(); return
                  }
                  val frameW = image.width
                  val frameH = image.height
                  val offsetY = (frameH * topFrac).toInt()
                  image.close()
                  if (isBlack(bmp)) {
                      blackCount++
                      if (blackCount == 12) status = "⚠️ الصورة سودا: البث مانع التسجيل. العب من Momiji مش من تطبيق Sony"
                      bmp.recycle(); return
                  }
                  if (blackCount >= 12) status = "✅ شغّال. افتح Momiji والعب"
                  blackCount = 0
                  busy = true
                  recognizer.process(InputImage.fromBitmap(bmp, 0))
                      .addOnSuccessListener { result ->
                          val lines = ArrayList<com.google.mlkit.vision.text.Text.Line>()
                          for (block in result.textBlocks) for (line in block.lines) {
                              if (isText(line.text)) lines.add(line)
                          }
                          lines.sortBy { it.boundingBox?.top ?: 0 }
                          handleLines(lines, frameW, frameH, offsetY)
                      }
                      .addOnCompleteListener {
                          bmp.recycle()
                          busy = false
                      }
              }

              private var blackCount = 0
              private fun isBlack(b: Bitmap): Boolean {
                  var bright = 0
                  val sx = max(1, b.width / 24); val sy = max(1, b.height / 12)
                  var y = 0
                  while (y < b.height) { var x = 0
                      while (x < b.width) { val c = b.getPixel(x, y)
                          if (((c shr 16) and 255) + ((c shr 8) and 255) + (c and 255) > 60) bright++
                          x += sx }
                      y += sy }
                  return bright < 3
              }

              private fun isText(s: String): Boolean {
                  val letters = s.count { it.isLetter() && it.code < 128 }
                  val lower = s.count { it in 'a'..'z' }
                  val words = s.split(' ').count { w -> w.count { it.isLetter() } >= 2 }
                  return letters >= 4 && lower >= 2 && words >= 2 && letters.toFloat() / max(1, s.length) > 0.6f
              }

              private fun handleLines(lines: List<com.google.mlkit.vision.text.Text.Line>, fw: Int, fh: Int, offY: Int) {
                  val now = System.currentTimeMillis()
                  if (lines.isEmpty()) {
                      if (shown && now - lastSeen > 900 + holdMs) {
                          shown = false
                          lastSentNorm = ""
                          publish(JSONObject().put("t", ""))
                          lastAr = ""
                      }
                      return
                  }
                  lastSeen = now
                  val text = lines.joinToString(" ") { it.text.trim() }
                  val norm = text.lowercase().replace(Regex("[^a-z0-9 ]"), "").replace(Regex("\\s+"), " ").trim()
                  if (norm.isEmpty() || similarity(norm, lastSentNorm) > 0.8) return
                  lastSentNorm = norm
                  lastEn = text

                  var top = Int.MAX_VALUE; var bottom = 0; var left = Int.MAX_VALUE; var right = 0
                  for (l in lines) {
                      val b = l.boundingBox ?: continue
                      top = min(top, b.top + offY); bottom = max(bottom, b.bottom + offY)
                      left = min(left, b.left); right = max(right, b.right)
                  }
                  // Map to the 16:9 game picture inside the phone screen (Remote Play leaves side bars on wide phones).
                  var vx = 0f; var vy = 0f; var vw = fw.toFloat(); var vh = fh.toFloat()
                  val aspect = fw.toFloat() / fh
                  if (aspect > 16f / 9f) { vw = fh * 16f / 9f; vx = (fw - vw) / 2f }
                  else if (aspect < 16f / 9f) { vh = fw * 9f / 16f; vy = (fh - vh) / 2f }
                  fun cx(x: Int) = ((x - vx) / vw).coerceIn(0f, 1f).toDouble()
                  fun cy(y: Int) = ((y - vy) / vh).coerceIn(0f, 1f).toDouble()
                  val pos = JSONArray().put(cy(top)).put(cy(bottom)).put(cx(left)).put(cx(right))

                  val mySeq = ++seq
                  translate(text) { ar ->
                      if (mySeq != seq) return@translate
                      lastAr = ar
                      shown = true
                      val o = JSONObject().put("t", ar).put("pm", posMode).put("en", text)
                      if (posMode != "off") o.put("pos", pos)
                      publish(o)
                  }
              }

              private fun similarity(a: String, b: String): Double {
                  if (a.isEmpty() || b.isEmpty()) return 0.0
                  if (a == b) return 1.0
                  var prev = IntArray(b.length + 1) { it }
                  for (i in 1..a.length) {
                      val cur = IntArray(b.length + 1)
                      cur[0] = i
                      for (j in 1..b.length) {
                          cur[j] = min(min(prev[j] + 1, cur[j - 1] + 1), prev[j - 1] + if (a[i - 1] == b[j - 1]) 0 else 1)
                      }
                      prev = cur
                  }
                  return 1.0 - prev[b.length].toDouble() / max(a.length, b.length)
              }

              private fun setupTranslator() {
                  val t = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.ENGLISH)
                          .setTargetLanguage(TranslateLanguage.ARABIC)
                          .build()
                  )
                  translator = t
                  status = "⏳ عم نزّل موديل الترجمة (أول مرة بس)..."
                  t.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener { translatorReady = true; if (running) status = "✅ شغّال. افتح Momiji والعب" }
                      .addOnFailureListener { translatorReady = false }
              }

              private fun translate(text: String, done: (String) -> Unit) {
                  cache[text]?.let { done(it); return }
                  val t = translator
                  if (translatorReady && t != null) {
                      t.translate(text)
                          .addOnSuccessListener { ar -> cache[text] = ar; done(ar) }
                          .addOnFailureListener { viaGoogle(text, done) }
                  } else {
                      viaGoogle(text, done)
                  }
              }

              private fun viaGoogle(text: String, done: (String) -> Unit) {
                  val url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=" +
                      URLEncoder.encode(text, "UTF-8")
                  http.newCall(Request.Builder().url(url).build()).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {}
                      override fun onResponse(call: Call, response: Response) {
                          response.use {
                              try {
                                  val arr = JSONArray(it.body?.string() ?: return).getJSONArray(0)
                                  val sb = StringBuilder()
                                  for (i in 0 until arr.length()) sb.append(arr.getJSONArray(i).getString(0))
                                  val ar = sb.toString()
                                  main.post { cache[text] = ar; done(ar) }
                              } catch (_: Exception) {}
                          }
                      }
                  })
              }

              private fun publish(o: JSONObject) {
                  o.put("id", java.lang.Long.toString(System.currentTimeMillis(), 36) + (Math.random() * 1e6).toInt())
                  mqtt.publish("freesard/v1/$code", o.toString())
              }

              private fun startInForeground() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  val builder = if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(NotificationChannel("fawaz", "FAWAZ", NotificationManager.IMPORTANCE_LOW))
                      Notification.Builder(this, "fawaz")
                  } else {
                      @Suppress("DEPRECATION") Notification.Builder(this)
                  }
                  val n = builder
                      .setContentTitle("FAWAZ GTA6")
                      .setContentText("عم يترجم GTA 6 للعربي")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              override fun onDestroy() {
                  running = false
                  status = "⏹ وقف"
                  handler.removeCallbacksAndMessages(null)
                  try { publish(JSONObject().put("t", "")) } catch (_: Exception) {}
                  handler.postDelayed({ mqtt.close() }, 300)
                  virtualDisplay?.release()
                  reader?.close()
                  projection?.stop()
                  translator?.close()
                  recognizer.close()
                  super.onDestroy()
              }
          }

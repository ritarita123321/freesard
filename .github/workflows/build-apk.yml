                      }
                      bars[key] = sb; root.addView(sb)
                  }
                  root.addView(button("👁 جرّب الشكل عالتلفزيون", Color.parseColor("#7B2FF7")) { sendCfg(true) })
                  root.addView(button("↺ رجّع الشكل الأصلي", Color.parseColor("#444444")) {
                      styleSp.setSelection(0)
                      for (sl in sliders) bars[sl[0] as String]!!.progress = (sl[4] as Int) - (sl[2] as Int)
                      sendCfg(true)
                  })

                  statusTv = TextView(this).apply { setTextColor(orange); textSize = 15f; setPadding(0, dp(12), 0, 0) }
                  lastTv = TextView(this).apply { setTextColor(Color.WHITE); textSize = 14f; setPadding(0, dp(6), 0, 0) }
                  root.addView(statusTv); root.addView(lastTv)

                  root.addView(label("الطريقة: كبس شغّل ← وافق عالتسجيل (اختار \"الشاشة كلها\") ← افتح Momiji (شاشة كاملة) والعب. الترجمة بتطلع عالتلفزيون."))

                  setContentView(ScrollView(this).apply { addView(root); isFillViewport = true })

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
                  }
                  ui.post(refresher)
                  mqtt.start()
                  ui.postDelayed({ cfgReady = true }, 800)
              }

              private fun value(key: String): Int {
                  val sl = sliders.first { it[0] == key }
                  return bars[key]!!.progress + (sl[2] as Int)
              }

              private val cfgSender = Runnable { sendCfg(true) }
              private fun cfgChanged() {
                  if (!cfgReady) return
                  ui.removeCallbacks(cfgSender); ui.postDelayed(cfgSender, 350)
              }

              private fun sendCfg(test: Boolean) {
                  val code = codeEt.text.toString().trim()
                  val ed = getSharedPreferences("fawaz", MODE_PRIVATE).edit().putInt("style", styleSp.selectedItemPosition)
                  for (sl in sliders) ed.putInt("cfg_" + sl[0], value(sl[0] as String))
                  ed.apply()
                  if (!mqtt.anyReady()) { Toast.makeText(this, "عم يتّصل... جرّب كمان شوي", Toast.LENGTH_SHORT).show(); return }
                  val cfg = JSONObject().put("style", styleSp.selectedItemPosition).put("bottom", value("bottom"))
                      .put("size", value("size")).put("bgw", value("bgw")).put("pad", value("pad")).put("x", -value("x"))
                  val o = JSONObject().put("cfg", cfg)
                  if (test) o.put("t", "هيك بتطلع الترجمة ع التلفزيون")
                  o.put("id", java.lang.Long.toString(System.currentTimeMillis(), 36) + (Math.random() * 1e6).toInt())
                  mqtt.publish("freesard/v1/$code", o.toString())
              }

              private val refresher = object : Runnable {
                  override fun run() {
                      statusTv.text = if (CaptureService.running || CaptureService.status.isNotEmpty())
                          CaptureService.status else "جاهز. كبس شغّل الترجمة."
                      lastTv.text = if (CaptureService.lastEn.isNotEmpty())
                          "EN: ${CaptureService.lastEn}\nAR: ${CaptureService.lastAr}" else ""
                      ui.postDelayed(this, 500)
                  }
              }

              private fun begin() {
                  val code = codeEt.text.toString().trim()
                  if (code.length < 4) { Toast.makeText(this, "حط كود التلفزيون", Toast.LENGTH_SHORT).show(); return }
                  getSharedPreferences("fawaz", MODE_PRIVATE).edit()
                      .putString("code", code)
                      .putInt("pm", pmSp.selectedItemPosition)
                      .putInt("hold", holdSp.selectedItemPosition)
                      .putInt("top", topSp.selectedItemPosition)
                      .apply()
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), REQ)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != REQ) return
                  if (resultCode != RESULT_OK || data == null) {
                      Toast.makeText(this, "لازم توافق عالتسجيل", Toast.LENGTH_LONG).show(); return
                  }
                  val i = Intent(this, CaptureService::class.java)
                      .putExtra(CaptureService.EXTRA_CODE, codeEt.text.toString().trim())
                      .putExtra(CaptureService.EXTRA_PM, pmVals[pmSp.selectedItemPosition])
                      .putExtra(CaptureService.EXTRA_HOLD, holdVals[holdSp.selectedItemPosition])
                      .putExtra(CaptureService.EXTRA_TOP, topVals[topSp.selectedItemPosition])
                      .putExtra(CaptureService.EXTRA_RESULT, resultCode)
                      .putExtra(CaptureService.EXTRA_DATA, data)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  ui.postDelayed({ openRemotePlay() }, 1200)
              }

              private fun openRemotePlay() {
                  val i = packageManager.getLaunchIntentForPackage("io.github.yazanj082.momiji")
                      ?: packageManager.getLaunchIntentForPackage("com.playstation.remoteplay")
                  if (i != null) startActivity(i)
                  else Toast.makeText(this, "Momiji مش منزّل عالتلفون", Toast.LENGTH_LONG).show()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun box(c: Int) = GradientDrawable().apply { setColor(c); cornerRadius = dp(12).toFloat() }
              private fun label(t: String) = TextView(this).apply {
                  text = t; setTextColor(Color.parseColor("#DDDDDD")); textSize = 13f; setPadding(0, dp(12), 0, dp(4))
              }
              private fun spinner(items: Array<String>, sel: Int) = Spinner(this).apply {
                  adapter = object : ArrayAdapter<String>(this@MainActivity, android.R.layout.simple_spinner_item, items) {
                      override fun getView(p: Int, v: View?, g: android.view.ViewGroup) =
                          (super.getView(p, v, g) as TextView).apply { setTextColor(Color.WHITE); textSize = 16f }
                  }.also { it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item) }
                  setSelection(sel.coerceIn(0, items.size - 1))
                  background = box(Color.parseColor("#33FFFFFF"))
                  onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) {}
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }
              }
              private fun button(t: String, c: Int, on: () -> Unit) = Button(this).apply {
                  text = t; setTextColor(Color.WHITE); textSize = 17f; isAllCaps = false
                  background = box(c)
                  layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(54)).apply { topMargin = dp(10) }
                  setOnClickListener { on() }
              }

              override fun onDestroy() { ui.removeCallbacksAndMessages(null); mqtt.close(); super.onDestroy() }
          }

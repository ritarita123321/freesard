          mkdir -p app/src/main/java/com/fawaz/gta6
          cat > app/src/main/java/com/fawaz/gta6/Mqtt.kt <<'FAWAZ_EOF_4'
          package com.fawaz.gta6

          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import okio.ByteString
          import okio.ByteString.Companion.toByteString
          import java.util.concurrent.TimeUnit

          /** Minimal MQTT 3.1.1 (QoS 0, publish only) over WebSocket. Same protocol as the web pages and the TV app. */
          class MqttWs(private val url: String, private val client: OkHttpClient) {
              @Volatile var subTopic: String? = null
              @Volatile var onMsg: ((String, String) -> Unit)? = null
              @Volatile private var ws: WebSocket? = null
              @Volatile var ready = false
                  private set
              @Volatile private var closed = false
              private val clientId = "fsa" + java.lang.Long.toString(System.nanoTime(), 36)

              fun connect() {
                  if (closed) return
                  val req = Request.Builder().url(url).header("Sec-WebSocket-Protocol", "mqtt").build()
                  ws = client.newWebSocket(req, object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          val body = str("MQTT") + byteArrayOf(4, 2, 0, 60) + str(clientId)
                          webSocket.send(packet(0x10, body).toByteString())
                      }

                      override fun onMessage(webSocket: WebSocket, bytes: ByteString) {
                          val a = bytes.toByteArray()
                          var i = 0
                          while (i + 1 < a.size) {
                              val type = (a[i].toInt() and 0xF0) shr 4
                              val qos = (a[i].toInt() shr 1) and 3
                              var mult = 1; var len = 0; var j = i + 1; var d: Int
                              do {
                                  if (j >= a.size) return
                                  d = a[j++].toInt() and 255
                                  len += (d and 127) * mult; mult *= 128
                              } while (d and 128 != 0)
                              if (j + len > a.size) return
                              if (type == 2) {
                                  ready = true
                                  subTopic?.let { t ->
                                      val body = byteArrayOf(0, 1) + str(t) + byteArrayOf(0)
                                      webSocket.send(packet(0x82, body).toByteString())
                                  }
                              } else if (type == 3 && len >= 2) {
                                  val tl = ((a[j].toInt() and 255) shl 8) or (a[j + 1].toInt() and 255)
                                  val topic = String(a, j + 2, tl, Charsets.UTF_8)
                                  val p = j + 2 + tl + (if (qos > 0) 2 else 0)
                                  val text = String(a, p, j + len - p, Charsets.UTF_8)
                                  try { onMsg?.invoke(topic, text) } catch (_: Exception) {}
                              }
                              i = j + len
                          }
                      }

                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) = retry()
                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) = retry()
                  })
              }

              private fun retry() {
                  ready = false
                  if (closed) return
                  Thread {
                      try { Thread.sleep(3000) } catch (_: InterruptedException) {}
                      connect()
                  }.start()
              }

              fun ping() {
                  if (ready) ws?.send(byteArrayOf(0xC0.toByte(), 0).toByteString())
              }

              fun publish(topic: String, text: String): Boolean {
                  if (!ready) return false
                  val body = str(topic) + text.toByteArray(Charsets.UTF_8)
                  return ws?.send(packet(0x30, body).toByteString()) ?: false
              }

              fun close() {
                  closed = true
                  ready = false
                  ws?.close(1000, null)
              }

              companion object {
                  fun str(s: String): ByteArray {
                      val b = s.toByteArray(Charsets.UTF_8)
                      return byteArrayOf((b.size shr 8).toByte(), (b.size and 255).toByte()) + b
                  }

                  fun packet(type: Int, body: ByteArray): ByteArray {
                      val head = ArrayList<Byte>()
                      head.add(type.toByte())
                      var len = body.size
                      do {
                          var d = len % 128
                          len /= 128
                          if (len > 0) d = d or 128
                          head.add(d.toByte())
                      } while (len > 0)
                      return head.toByteArray() + body
                  }
              }
          }

          /** Connects to all public brokers at once, so the phone and the TV always share at least one. */
          class MultiMqtt {
              private val brokers = listOf(
                  "wss://broker.hivemq.com:8884/mqtt",
                  "wss://broker.emqx.io:8084/mqtt",
                  "wss://test.mosquitto.org:8081/mqtt"
              )
              private val http = OkHttpClient.Builder().readTimeout(0, TimeUnit.MILLISECONDS).build()
              private val clients = brokers.map { MqttWs(it, http) }

              fun start(subTopic: String? = null, onMsg: ((String, String) -> Unit)? = null) = clients.forEach {
                  it.subTopic = subTopic; it.onMsg = onMsg; it.connect()
              }
              fun publish(topic: String, text: String) = clients.forEach { it.publish(topic, text) }
              fun anyReady() = clients.any { it.ready }
              fun ping() = clients.forEach { it.ping() }
              fun close() = clients.forEach { it.close() }
          }
